<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GP TAPICERÍA - Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>

body{

    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f5f9;
    font-family:'Segoe UI', sans-serif;

}


.login-card{

    width:380px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);

}


.logo{

    text-align:center;
    margin-bottom:25px;

}


.logo img{

    width:100px;

}


.logo h2{

    margin-top:15px;
    font-weight:700;
    color:#1e293b;

}


.logo small{

    color:#64748b;

}


.form-control{

    border-radius:12px;
    padding:12px;

}


.btn-login{

    width:100%;
    padding:12px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    border:none;
    font-weight:600;

}


.btn-login:hover{

    background:#1e40af;

}


</style>

</head>


<body>


<div class="login-card">


<div class="logo">


<img src="{{ url_for('static', filename='img/logo.png') }}">


<h2>GP TAPICERÍA</h2>

<small>Sistema de Gestión</small>


</div>



<form method="POST">



<div class="mb-3">

<label class="form-label">

<i class="bi bi-person-fill"></i>

Usuario

</label>


<input 
class="form-control"
name="usuario"
placeholder="Ingrese su usuario"
required>

</div>




<div class="mb-3">


<label class="form-label">

<i class="bi bi-lock-fill"></i>

Clave

</label>


<input 
class="form-control"
type="password"
name="clave"
placeholder="Ingrese su clave"
required>


</div>



<button class="btn-login">

<i class="bi bi-box-arrow-in-right"></i>

Entrar

</button>



</form>


</div>


</body>

</html>
